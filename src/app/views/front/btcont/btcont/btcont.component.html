
<div class="w3-overlay w3-hide-large" onclick="w3_close()" style="cursor:pointer" title="close side menu" id="myOverlay"></div>
<div class="w3-main" style="margin-left:340px;margin-right:40px">


<button class="contact-btn" (click)="openModal()">Contact</button>


<div class="modal" *ngIf="showModal">
  <div class="modal-content">
    <span class="close" (click)="closeModal()">
      <i class="fas fa-times"></i>
    </span>
    
    <h3><i class="fas fa-envelope"></i> Contact</h3>
    
    <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="input-group">
        <i class="fas fa-phone"></i>
      <input type="text" id="phone" name="phone" [(ngModel)]="phone" required placeholder="Numéro">
      </div>
      <div class="input-group">
        <i class="fab fa-facebook"></i>
      <input type="text" id="facebook" name="facebook" [(ngModel)]="facebook" required placeholder="Facebook">
      </div>
      <div class="input-group">
        <i class="fab fa-instagram"></i>
      
      <input type="text" id="instagram" name="instagram" [(ngModel)]="instagram" required placeholder="Instagram">
      </div>
      <button type="submit" [disabled]="!contactForm.valid">Envoyer</button>
    </form>

    <div *ngIf="submitted" style="margin-top: 15px;">
      <p><strong>Numéro :</strong> {{ phone }}</p>
      <p><strong>Facebook :</strong> {{ facebook }}</p>
      <p><strong>Instagram :</strong> {{ instagram }}</p>
    </div>
  </div>
</div>
