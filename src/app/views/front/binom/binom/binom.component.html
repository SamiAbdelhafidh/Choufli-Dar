<div class="page-container">
  <div class="card-wrapper">
    <header class="header">
      <div class="logo">
        <img src="logoo.png" alt="Logo de l'app" />
      </div>
      <button class="add-btn" (click)="addCard()">+ Ajouter</button>
    </header>

    <main class="grid-container">
      <div class="card" *ngFor="let card of cards">
        <div class="image-zone">
          <label class="upload-label">
            Ajouter une image
            <input type="file" accept="image/*" hidden />
          </label>
        </div>
        <form (ngSubmit)="onSubmit($event)">
          <input type="text" placeholder="Name" required />
          <input type="number" placeholder="Age" required />
          <input type="text" placeholder="Location" required />
          <input type="text" placeholder="Institute" required />
          <textarea placeholder="Description" required></textarea>
          <input type="text" placeholder="To share" required />
          <div class="login-button" (click)="contact()">
            <button class="contact-btn" type="submit">Contacter</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
